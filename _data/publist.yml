- title: "Neural processing of children’s theory of mind in a naturalistic story-listening paradigm"
  image: GAS.png 
  description: Neuroimaging of Theory of mind (ToM) in young children often faces challenges in ecological validity and quality data collection. We developed and implemented an innovative naturalistic story-listening paradigm, which is child-friendly, engaging, and ecologically valid, to shed light on ToM neural mechanisms in childhood.
  authors: Yu, C. L., Eggleston, R. L., Zhang, K., Nickerson, N., Sun, X., Marks, R. A., Hu, X., Brennan, J. R., Wellman, H. M., & Kovelman, I. 
  link:
    url: https://academic.oup.com/scan/article/20/1/nsaf022/8045374
    display: Oxford Academic (2025)
  highlight: 2
